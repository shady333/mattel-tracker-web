<script>
const VIP_KEY = 'dgarage_vip_expires';
const VIP_PASS = 'mattel2026';
const VIP_DURATION = 30 * 24 * 60 * 60 * 1000; // 30 days

const SPLASH_KEY = 'dgarage_splash_shown';
const SPLASH_INTERVAL = 7 * 24 * 60 * 60 * 1000; // 7 days

function isVip() {
    const expires = localStorage.getItem(VIP_KEY);
    return expires && Date.now() < parseInt(expires);
}

function setVip() {
    localStorage.setItem(VIP_KEY, Date.now() + VIP_DURATION);
}

function clearVip() {
    localStorage.removeItem(VIP_KEY);
}

function closeSplash() {
    document.getElementById('splash').classList.add('hidden');
    localStorage.setItem(SPLASH_KEY, Date.now());
    trackEvent('splash_dismissed');
}

function initSplash() {
    const last = localStorage.getItem(SPLASH_KEY);
    const shouldShow = !last || (Date.now() - parseInt(last)) > SPLASH_INTERVAL;
    if (shouldShow) {
        document.getElementById('splash').classList.remove('hidden');
        trackEvent('splash_shown');
    }
}

document.getElementById('splash').addEventListener('click', function(e) {
    if (e.target === this) closeSplash();
});

function showLoginModal() {
    document.getElementById('login-modal').classList.remove('hidden');
    document.getElementById('login-input').value = '';
    document.getElementById('login-error').classList.add('hidden');
}

function hideLoginModal() {
    document.getElementById('login-modal').classList.add('hidden');
}

function attemptLogin() {
    const val = document.getElementById('login-input').value;
    if (val === VIP_PASS) {
        setVip();
        hideLoginModal();
        applyMode();
        trackEvent('vip_login_success');
    } else {
        document.getElementById('login-error').classList.remove('hidden');
        document.getElementById('login-input').value = '';
        trackEvent('vip_login_fail');
    }
}

function continueAsGuest() {
    clearVip();
    hideLoginModal();
    applyMode();
    trackEvent('guest_continue');
}

function applyMode() {
    const vip = isVip();

    // Повне приховування карток з новинками для гостей, або відображення для VIP
    document.querySelectorAll('.vip-only-card').forEach(el => {
        if (vip) {
            el.classList.remove('hidden');
        } else {
            el.classList.add('hidden');
        }
    });

    // Керування станом вкладки Coming Soon
    document.getElementById('soon-lock').classList.toggle('hidden', vip);
    document.getElementById('soon-unlocked').classList.toggle('hidden', !vip);
}

function initAuth() {
    if (isVip()) {
        hideLoginModal();
        applyMode();
        trackEvent('auto_login');
    } else {
        trackEvent('login_screen_shown');
    }
}

document.getElementById('login-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') attemptLogin();
});

function switchTab(tab) {
    document.querySelectorAll('.tab-section').forEach(s => s.classList.add('hidden'));
    document.getElementById('section-' + tab).classList.remove('hidden');

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('tab-active');
        btn.classList.add('text-gray-400');
    });

    const activeBtn = document.getElementById('tab-' + tab);
    activeBtn.classList.add('tab-active');
    activeBtn.classList.remove('text-gray-400');

    window.scrollTo({ top: 0, behavior: 'smooth' });
    trackEvent('tab_switch', { tab });
}

function toggleSection(id) {
    const content = document.getElementById(id + '-content');
    const icon = document.getElementById(id + '-icon');
    const isNowHidden = content.classList.toggle('hidden');
    if (icon) icon.classList.toggle('rotate-180', !isNowHidden);
    trackEvent('section_toggle', { section: id, expanded: !isNowHidden });
}

function forceRefresh() {
    trackEvent('manual_refresh');
    localStorage.setItem('last_refresh', Date.now());
    location.href = location.href;
}

async function shareSite() {
    const shareData = {
        title: 'dGarage | Mattel Tracker',
        text: 'Живий трекер наявності Hot Wheels від Mattel — залишки, новинки та розпродані позиції.',
        url: window.location.href
    };

    trackEvent('share_click');

    if (navigator.share) {
        try {
            await navigator.share(shareData);
            trackEvent('share_success');
        } catch (err) {
            trackEvent('share_cancelled');
        }
        return;
    }

    try {
        await navigator.clipboard.writeText(shareData.url);
        alert('Посилання скопійовано в буфер обміну!');
        trackEvent('share_clipboard_fallback');
    } catch (err) {
        window.prompt('Скопіюйте посилання:', shareData.url);
        trackEvent('share_prompt_fallback');
    }
}

function formatDates() {
    const options = { month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false };

    document.querySelectorAll('.product-time').forEach(el => {
        const utc = el.dataset.utc;
        if (!utc || utc === 'None') return;
        const date = new Date(utc);
        const mode = el.dataset.mode;
        el.innerText = (mode === 'sold' ? 'Sold: ' : 'Upd: ') + date.toLocaleString('en-US', options);
    });

    const buildEl = document.querySelector('.build-time');
    if (buildEl) {
        const utc = buildEl.dataset.utc;
        if (utc) {
            buildEl.innerText = new Date(utc).toLocaleString('en-US', options);
        }
    }
}

// PWA Installation
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

if (isIOS && !isStandalone) {
    installBtn.innerHTML = 'Add to Home Screen';
    installBtn.classList.remove('hidden');
    installBtn.classList.replace('bg-gray-900', 'bg-blue-600');
    installBtn.onclick = () => {
        trackEvent('pwa_install_ios');
        alert('iOS Install:\n1. Tap the Share icon.\n2. Select "Add to Home Screen".');
    };
} else {
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.remove('hidden');
        trackEvent('pwa_install_prompt');
    });

    installBtn.onclick = async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt = null;
        }
    };
}

// Heatmap and analytical tracking
let maxScrollPercent = 0;
const scrollMilestones = new Set();

function trackScrollDepth() {
    const doc = document.documentElement;
    const scrollTop = window.scrollY || doc.scrollTop;
    const scrollHeight = doc.scrollHeight - doc.clientHeight;
    if (scrollHeight <= 0) return;

    const percent = Math.round((scrollTop / scrollHeight) * 100);
    if (percent > maxScrollPercent) maxScrollPercent = percent;

    [25, 50, 75, 100].forEach(mark => {
        if (percent >= mark && !scrollMilestones.has(mark)) {
            scrollMilestones.add(mark);
            trackEvent('scroll_depth', { percent: mark });
        }
    });
}

window.addEventListener('scroll', () => {
    if (!window.__scrollTicking) {
        window.__scrollTicking = true;
        requestAnimationFrame(() => {
            trackScrollDepth();
            window.__scrollTicking = false;
        });
    }
});

let sessionStart = Date.now();
let visibleStart = document.visibilityState === 'visible' ? Date.now() : null;
let accumulatedVisibleMs = 0;

function onVisibilityChange() {
    if (document.visibilityState === 'visible') {
        visibleStart = Date.now();
    } else {
        if (visibleStart) {
            accumulatedVisibleMs += Date.now() - visibleStart;
            visibleStart = null;
        }
    }
}
document.addEventListener('visibilitychange', onVisibilityChange);

window.addEventListener('beforeunload', () => {
    if (visibleStart) {
        accumulatedVisibleMs += Date.now() - visibleStart;
        visibleStart = null;
    }
    trackEvent('session_summary', {
        total_ms: Date.now() - sessionStart,
        visible_ms: accumulatedVisibleMs,
        max_scroll_percent: maxScrollPercent
    });
});

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === 'visible') {
        const last = localStorage.getItem('last_refresh');
        if (!last || (Date.now() - last) > 15 * 60 * 1000) {
            forceRefresh();
        }
    }
});

window.addEventListener('online', () => trackEvent('connection_status', { status: 'online' }));
window.addEventListener('offline', () => trackEvent('connection_status', { status: 'offline' }));

document.addEventListener('click', (e) => {
    try {
        const target = e.target.closest('[data-heatmap]') || e.target;
        const rect = target.getBoundingClientRect();
        trackEvent('click_heatmap', {
            tag: target.tagName,
            text: (target.innerText || '').slice(0, 40),
            x_rel: Number(((e.clientX - rect.left) / rect.width).toFixed(3)),
            y_rel: Number(((e.clientY - rect.top) / rect.height).toFixed(3))
        });
    } catch (_) {}
});

// Run
initAuth();
initSplash();
formatDates();
</script>
